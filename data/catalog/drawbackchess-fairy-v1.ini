# DrawbackEngine Fairy-Stockfish heuristic variant, schema version 1.
#
# Validate with a pinned Fairy-Stockfish binary:
#   fairy-stockfish check drawbackchess-fairy-v1.ini
#
# This configuration intentionally does not claim full Drawback Chess parity.
# The outer DrawbackEngine authority supplies the exact legal root mask and
# owns hidden drawbacks, rule state, terminal precedence, and castling
# king-en-passant.

[drawbackchess:chess]

# Model the king as a capturable commoner. Keeping Fairy-Stockfish's royal king
# causes an attacked king position to be adjudicated before the exact root mask
# can permit the side to ignore check. Explicitly selecting the commoner as the
# castling king preserves ordinary castling geometry and passes the variant
# configuration checker.
king = -
commoner = k
castlingKingPiece = k
checking = false

# Losing the last king ends the game for that side.
extinctionValue = loss
extinctionPieceTypes = k

# Drawback Chess treats having no available move as a loss.
stalemateValue = loss

# DrawbackEngine, not Fairy-Stockfish, owns repetition and move-count endings.
nFoldRule = 0
nMoveRule = 0
